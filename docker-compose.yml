services:
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: zakupki-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  embeddings:
    build:
      context: ./services/embeddings
      dockerfile: Dockerfile
    container_name: zakupki-embeddings
    environment:
      EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\""]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s

  indexer:
    build:
      context: ./backend/Zakupki.Indexer
      dockerfile: Dockerfile
    container_name: zakupki-indexer
    environment:
      DOTNET_ENVIRONMENT: Production
      Indexer__DataPath: /data/orders
      Indexer__OpenSearchUrl: http://opensearch:9200
      Indexer__EmbeddingsUrl: http://embeddings:8080
      Indexer__PollIntervalSeconds: "60"
      Indexer__EmbeddingDimensions: "384"
      Indexer__MaxChunksPerOrder: "80"
      Indexer__MinEmbedChunkChars: "80"
    volumes:
      - ./data/orders:/data/orders
    depends_on:
      opensearch:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./backend/Zakupki.Api
      dockerfile: Dockerfile
    container_name: zakupki-api
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Cors__Origins__0: http://localhost:3000
      Cors__Origins__1: http://localhost:5173
      Search__OpenSearchUrl: http://opensearch:9200
      Search__EmbeddingsUrl: http://embeddings:8080
      Search__EmbeddingDimensions: "384"
      Orders__DataPath: /data/orders
    volumes:
      - ./data/orders:/data/orders:ro
    depends_on:
      opensearch:
        condition: service_healthy
      embeddings:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zakupki-frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_started

  collector:
    build:
      context: ./backend/Zakupki.Collector
      dockerfile: Dockerfile
    container_name: zakupki-collector
    environment:
      DOTNET_ENVIRONMENT: Production
      Collector__DataPath: /data/orders
      Collector__PollIntervalSeconds: "90"
      Collector__RequestDelayMs: "700"
      Collector__RssUrl: "https://zakupki.gov.ru/epz/order/extendedsearch/rss.html?fz44=on&af=on&sortBy=UPDATE_DATE&sortDirection=false&recordsPerPage=_50"
    volumes:
      - ./data/orders:/data/orders
    restart: unless-stopped

volumes:
  opensearch-data:
